name: Import Olist Dataset via Git LFS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-olist-lfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-olist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs version

      - name: Download Olist dataset
        run: |
          set -euo pipefail
          mkdir -p data/raw
          curl -fL --retry 5 --retry-delay 3 \
            "https://www.kaggle.com/api/v1/datasets/download/olistbr/brazilian-ecommerce" \
            -o /tmp/olist.zip
          unzip -o /tmp/olist.zip -d /tmp/olist
          find /tmp/olist -type f -name "*.csv" -print
          for file in /tmp/olist/*.csv; do
            [ -f "$file" ] || continue
            cp "$file" data/raw/
          done

      - name: Validate dataset
        run: |
          set -euo pipefail
          expected=(
            olist_customers_dataset.csv
            olist_geolocation_dataset.csv
            olist_order_items_dataset.csv
            olist_order_payments_dataset.csv
            olist_order_reviews_dataset.csv
            olist_orders_dataset.csv
            olist_products_dataset.csv
            olist_sellers_dataset.csv
            product_category_name_translation.csv
          )
          for file in "${expected[@]}"; do
            test -s "data/raw/$file"
          done
          echo "All 9 Olist CSV files are present."
          du -sh data/raw

      - name: Ensure raw CSVs use Git LFS
        run: |
          git lfs track "data/raw/*.csv"
          git add .gitattributes
          git add data/raw/*.csv

      - name: Commit dataset
        run: |
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Olist raw dataset via Git LFS [skip ci]"

      - name: Push Git commit and LFS objects
        run: |
          git push origin HEAD:main
